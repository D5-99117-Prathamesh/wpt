<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Lists</title>
</head>

<body>
    <h1>Nested Lists</h1>
    <h2>Course Modules</h2>
    <ol type="I">
        <li>Programming Foundation
            <ol type="a">
                <li>C Language</li>
                <li>C++ with OOP</li>
            </ol>
        </li>
        <li>Database Technology
            <ol type="a">
                <li>SQL</li>
                <li>MongoDB (optional)</li>
            </ol>
        </li>
        <li>Web Programming
            <ol type="1">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ol>
        </li>
    </ol>

    <h2>Abbreviations</h2>
    <dl>
        <dt><b>HTML</b></dt>
        <dd>Hypertext Markup Language</dd>
        <dt><b>WPT</b></dt>
        <dd>Web Programming Technology</dd>
    </dl>
</body>

</html>
